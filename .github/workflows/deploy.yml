name: Deploy DXP to GitHub Pages

# Public landing build only. Admin ships through its independent workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

# Allow only one concurrent deployment; cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Custom domain is served at the apex of the subdomain, so the app lives at
  # the site root. (For a default github.io project site, use "/<repo>/".)
  BASE_PATH: "/"
  # vite.config.ts requires PORT even for `build`; the value is irrelevant here.
  PORT: "5000"
  CUSTOM_DOMAIN: "pacific-code-labs.jcampos.dev"
  # Run the JS actions on Node 24 now (GitHub forces this on 2026-06-16); silences
  # the Node-20 deprecation warning. Remove once Node 24 is the runner default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # Filtered install: only the DXP and its workspace deps — skips the
        # backend (api-server/db) so CI stays fast and needs no native esbuild.
        run: pnpm install --frozen-lockfile --filter "@pcl/landing..."

      - name: Pull published content for SEO
        env:
          VITE_CDN_URL: https://cdn.pacific-code-labs.jcampos.dev
        run: node fe/landing/scripts/pull-published-content.mjs

      - name: Build landing
        env:
          NODE_ENV: production
        run: |
          pnpm --filter @pcl/landing run typecheck
          pnpm --filter @pcl/landing run build
          if rg "__local/|oauth2/authorize|api/admin|VITE_ADMIN" fe/landing/dist/public; then exit 1; fi

      - name: Add custom domain (CNAME)
        # The build step pre-renders per-route static HTML (incl. a noindex
        # 404.html SPA fallback) via scripts/prerender.mjs, so no cp step here.
        run: echo "$CUSTOM_DOMAIN" > fe/landing/dist/public/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fe/landing/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # IndexNow key — also hosted at /<key>.txt (public/). Not secret: the file
      # is public by design. Push-notifies Bing/Yandex/AI engines on each deploy.
      INDEXNOW_KEY: "93314dacee5c453a915339f82ae16f8c"
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping IndexNow (Bing / Yandex / AI engines)
        # Runs after the site (and the key file) is live. Submits every
        # language-prefixed URL. Update SLUGS if routes change (see CLAUDE.md).
        run: |
          HOST="$CUSTOM_DOMAIN"
          LANGS="es en"
          SLUGS="products services how about philosophy case-studies contact privacy terms"
          urls=""
          for l in $LANGS; do
            urls="$urls\"https://$HOST/$l\","
            for s in $SLUGS; do urls="$urls\"https://$HOST/$l/$s\","; done
          done
          urls="${urls%,}"
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"$HOST\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://$HOST/$INDEXNOW_KEY.txt\",\"urlList\":[$urls]}" \
            || echo "IndexNow ping failed (non-fatal)"
